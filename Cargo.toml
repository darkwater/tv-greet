[package]
name = "tv-greet"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe     = { version = "0.33.3", features = ["wgpu"] }
egui       = "0.33.3"
futures    = "0.3.32"
gilrs      = "0.11.1"
greetd_ipc = { version = "0.10.3", features = ["tokio-codec"] }
tokio      = { version = "1.50.0", features = ["rt", "net", "sync", "signal"] }
